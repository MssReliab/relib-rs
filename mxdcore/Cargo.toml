[package]
name = "relib-mxd"
description = "Matrix Decision Diagrams (MxD) for the relib reliability toolkit: relations over multi-valued state vectors, with cross product and pre/post image."
keywords = ["decision-diagram", "mxd", "relation", "reliability"]
categories = ["data-structures", "science"]
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "mxdcore"

[dependencies]
common = { path = "../common", version = "0.14.1", package = "relib-common" }

# Only for the bridging-theorem check, which needs the minimal-cut-vector side.
# `relib-mss` does not depend on this crate, so there is no cycle — but it does
# put this crate last in the publish order, after `relib-mss`, rather than
# straight after `relib-common`.
[dev-dependencies]
mss = { path = "../mss", version = "0.14.1", package = "relib-mss" }

[package.metadata.docs.rs]
all-features = true
